<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskInsight - Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>TaskInsight</h1>
    <p>Aplicação completa com backend, autenticação, CRUD e análises.</p>
  </header>

  <main>
    <section id="auth-section" class="card">
      <h2 id="authTitle">Login</h2>
      <p id="authSubtitle">Use <strong>admin@taskinsight.com</strong> / <strong>senha123</strong> ou registre um usuário.</p>
      <div class="form-row" id="nameField" style="display: none;">
        <label for="name">Nome</label>
        <input id="name" type="text" placeholder="Seu nome" />
      </div>
      <div class="form-row">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="seu@email.com" />
      </div>
      <div class="form-row">
        <label for="password">Senha</label>
        <input id="password" type="password" placeholder="senha" />
      </div>
      <div class="buttons">
        <button id="loginBtn">Entrar</button>
        <button id="registerBtn" class="secondary">Registrar</button>
        <button id="backBtn" class="secondary" style="display: none;">Voltar</button>
      </div>
      <div id="authMessage" class="message"></div>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
